<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head('Notifications')}"></head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container my-4">
    <div class="row g-4">
        <div class="col-lg-3">
            <div th:replace="~{layout/sidebar-customer :: customer-sidebar('notifications')}"></div>
        </div>

        <div class="col-lg-9">
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold text-success"><i class="bi bi-bell-fill me-2"></i>My Notifications & Alerts / सूचना</h5>
                    <form th:action="@{/customer/notifications/read-all}" method="POST" class="m-0">
                        <button type="submit" class="btn btn-sm btn-outline-secondary">Mark All as Read</button>
                    </form>
                </div>
                <div class="card-body p-3">
                    <div th:if="${notificationPage.empty}" class="text-center py-5 text-muted">
                        <i class="bi bi-bell-slash text-muted" style="font-size: 3rem;"></i>
                        <h6 class="mt-3">No notifications right now.</h6>
                    </div>

                    <div class="d-flex flex-column gap-3" th:if="${!notificationPage.empty}">
                        <div class="p-3 rounded border d-flex justify-content-between align-items-start"
                             th:each="notif : ${notificationPage.content}"
                             th:classappend="${!notif.isRead} ? 'bg-light-green border-success' : 'bg-white'">
                            <div>
                                <div class="d-flex align-items-center gap-2 mb-1">
                                    <span class="badge" 
                                          th:classappend="${notif.type.name() == 'WHATSAPP'} ? 'bg-success' : (${notif.type.name() == 'SMS'} ? 'bg-primary' : 'bg-warning text-dark')"
                                          th:text="${notif.type.displayNameEn}">WhatsApp</span>
                                    <strong class="text-dark" th:text="${notif.title}">Notification Title</strong>
                                    <span th:if="${!notif.isRead}" class="badge bg-danger rounded-pill" style="font-size: 0.65rem;">NEW</span>
                                </div>
                                <p class="small text-secondary mb-1" th:text="${notif.message}">Message content</p>
                                <small class="text-muted" style="font-size: 0.75rem;" th:text="${#temporals.format(notif.sentAt, 'dd MMM yyyy, hh:mm a')}">Date</small>
                            </div>
                            <form th:if="${!notif.isRead}" th:action="@{'/customer/notifications/' + ${notif.id} + '/read'}" method="POST" class="m-0">
                                <button type="submit" class="btn btn-xs btn-outline-success" style="font-size: 0.75rem;">Mark Read</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
