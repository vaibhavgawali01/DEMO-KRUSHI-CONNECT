<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/header :: head('Products')}"></head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container my-4">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}" class="text-success text-decoration-none" th:text="#{nav.home}">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="#{nav.products}">Products Catalog</li>
        </ol>
    </nav>

    <div class="row g-4">
        <!-- Sidebar Filters -->
        <div class="col-lg-3">
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header bg-success text-white py-3 d-flex justify-content-between align-items-center">
                    <h6 class="mb-0 fw-bold"><i class="bi bi-funnel me-2"></i><span th:text="${#locale.language == 'mr' ? 'फिल्टर' : 'Filter Products'}">Filter Products</span></h6>
                    <a th:href="@{/products}" class="text-white-50 text-decoration-none small" th:text="#{product.filter.reset}">Reset</a>
                </div>
                <div class="card-body p-3">
                    <form th:action="@{/products}" method="GET" id="filterForm">
                        <input type="hidden" name="keyword" th:value="${keyword}">
                        <input type="hidden" name="sort" th:value="${currentSort}">

                        <!-- Categories Filter -->
                        <div class="mb-4">
                            <label class="form-label fw-bold text-success small text-uppercase" th:text="#{product.filter.category}">Category</label>
                            <div class="d-flex flex-column gap-1">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="categoryId" id="cat_all" value="" th:checked="${selectedCategory == null}">
                                    <label class="form-check-label small" for="cat_all" th:text="${#locale.language == 'mr' ? 'सर्व वर्ग' : 'All Categories'}">All Categories</label>
                                </div>
                                <div class="form-check" th:each="cat : ${categories}">
                                    <input class="form-check-input" type="radio" name="categoryId" th:id="${'cat_' + cat.id}" th:value="${cat.id}" th:checked="${selectedCategory == cat.id}">
                                    <label class="form-check-label small" th:for="${'cat_' + cat.id}" th:text="${#locale.language == 'mr' and cat.nameMr != null ? cat.nameMr : cat.name}">Cat Name</label>
                                </div>
                            </div>
                        </div>

                        <!-- Brand Filter -->
                        <div class="mb-4">
                            <label class="form-label fw-bold text-success small text-uppercase" th:text="#{product.filter.brand}">Company / Brand</label>
                            <select name="company" class="form-select form-select-sm">
                                <option value="" th:selected="${selectedCompany == null or selectedCompany == ''}" th:text="${#locale.language == 'mr' ? 'सर्व ब्रँड्स' : 'All Brands'}">All Brands</option>
                                <option th:each="b : ${brands}" th:value="${b}" th:text="${b}" th:selected="${selectedCompany == b}">Brand Name</option>
                            </select>
                        </div>

                        <!-- Price Range Filter -->
                        <div class="mb-4">
                            <label class="form-label fw-bold text-success small text-uppercase" th:text="#{product.filter.price_range}">Price Range (₹)</label>
                            <div class="d-flex gap-2 align-items-center">
                                <input type="number" name="minPrice" class="form-control form-control-sm" placeholder="Min" th:value="${minPrice}">
                                <span>-</span>
                                <input type="number" name="maxPrice" class="form-control form-control-sm" placeholder="Max" th:value="${maxPrice}">
                            </div>
                        </div>

                        <!-- Stock Availability -->
                        <div class="mb-4">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" name="inStockOnly" id="inStockCheck" value="true" th:checked="${inStockOnly}">
                                <label class="form-check-label small fw-semibold" for="inStockCheck" th:text="#{product.filter.in_stock}">In Stock Only</label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-krushi btn-sm w-100 fw-bold" th:text="#{product.filter.apply}">Apply Filters</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Products Main Grid -->
        <div class="col-lg-9">
            <!-- Top Controls Bar -->
            <div class="card border-0 shadow-sm mb-4 rounded-3">
                <div class="card-body py-2 px-3 d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2">
                    <div class="text-muted small">
                        Showing <strong class="text-dark" th:text="${productPage.numberOfElements}">0</strong> of <strong class="text-dark" th:text="${productPage.totalElements}">0</strong> products
                        <span th:if="${keyword != null and !keyword.isBlank()}" th:text="' for query: &quot;' + ${keyword} + '&quot;'"></span>
                    </div>

                    <!-- Sort Select -->
                    <div class="d-flex align-items-center gap-2">
                        <label class="small text-muted text-nowrap" th:text="#{product.sort.by}">Sort By:</label>
                        <select class="form-select form-select-sm" style="width: auto;" onchange="window.location.href=this.value;">
                            <option th:value="@{/products(categoryId=${selectedCategory}, company=${selectedCompany}, minPrice=${minPrice}, maxPrice=${maxPrice}, inStockOnly=${inStockOnly}, keyword=${keyword}, sort='newest')}" th:selected="${currentSort == 'newest'}" th:text="#{product.sort.newest}">Newest</option>
                            <option th:value="@{/products(categoryId=${selectedCategory}, company=${selectedCompany}, minPrice=${minPrice}, maxPrice=${maxPrice}, inStockOnly=${inStockOnly}, keyword=${keyword}, sort='price_asc')}" th:selected="${currentSort == 'price_asc'}" th:text="#{product.sort.price_low}">Price: Low to High</option>
                            <option th:value="@{/products(categoryId=${selectedCategory}, company=${selectedCompany}, minPrice=${minPrice}, maxPrice=${maxPrice}, inStockOnly=${inStockOnly}, keyword=${keyword}, sort='price_desc')}" th:selected="${currentSort == 'price_desc'}" th:text="#{product.sort.price_high}">Price: High to Low</option>
                            <option th:value="@{/products(categoryId=${selectedCategory}, company=${selectedCompany}, minPrice=${minPrice}, maxPrice=${maxPrice}, inStockOnly=${inStockOnly}, keyword=${keyword}, sort='rating')}" th:selected="${currentSort == 'rating'}" th:text="#{product.sort.rating}">Top Rated</option>
                            <option th:value="@{/products(categoryId=${selectedCategory}, company=${selectedCompany}, minPrice=${minPrice}, maxPrice=${maxPrice}, inStockOnly=${inStockOnly}, keyword=${keyword}, sort='popular')}" th:selected="${currentSort == 'popular'}" th:text="#{product.sort.popular}">Most Popular</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div th:if="${productPage.empty}" class="card border-0 shadow-sm p-5 text-center">
                <i class="bi bi-emoji-neutral text-muted" style="font-size: 3.5rem;"></i>
                <h5 class="fw-bold mt-3" th:text="${#locale.language == 'mr' ? 'कोणतीही कृषी उत्पादने आढळली नाहीत' : 'No Agricultural Products Found'}">No Agricultural Products Found</h5>
                <p class="text-muted small" th:text="${#locale.language == 'mr' ? 'कृपया आपले फिल्टर किंवा शोध शब्द तपासा.' : 'Try clearing your filters or search keywords.'}">Try clearing your filters or search keywords.</p>
                <div>
                    <a th:href="@{/products}" class="btn btn-krushi btn-sm" th:text="${#locale.language == 'mr' ? 'सर्व फिल्टर काढा' : 'Clear All Filters'}">Clear All Filters</a>
                </div>
            </div>

            <!-- Product Cards Grid -->
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3" th:if="${!productPage.empty}">
                <div class="col" th:each="product : ${productPage.content}">
                    <div class="product-card">
                        <div class="product-img-wrapper">
                            <span th:if="${product.stockQuantity > product.minimumStock}" class="badge bg-success badge-stock" th:text="#{product.in_stock}">In Stock</span>
                            <span th:if="${product.stockQuantity <= product.minimumStock and product.stockQuantity > 0}" class="badge bg-warning text-dark badge-stock" th:text="#{product.low_stock}">Low Stock</span>
                            <span th:if="${product.stockQuantity == 0}" class="badge bg-danger badge-stock" th:text="#{product.out_of_stock}">Out of Stock</span>
                            
                            <span class="badge-category" th:text="${#locale.language == 'mr' and product.category.nameMr != null ? product.category.nameMr : product.category.name}">Category</span>
                            <img th:src="@{'/images/' + ${product.image}}" th:alt="${product.name}" onerror="this.src='https://placehold.co/300x200/e8f5e9/2e7d32?text=Krushi+Product'">
                        </div>

                        <div class="product-body">
                            <span class="product-company" th:text="${product.company}">Company</span>
                            <h6 class="product-title">
                                <a th:href="@{'/products/' + ${product.id}}" class="text-decoration-none text-dark" th:text="${#locale.language == 'mr' and product.nameMr != null ? product.nameMr : product.name}">Product Name</a>
                            </h6>

                            <div class="d-flex align-items-center gap-1 text-warning small mb-2">
                                <i class="bi bi-star-fill"></i>
                                <span class="fw-bold text-dark" th:text="${product.rating}">4.8</span>
                                <span class="text-muted" th:text="'(' + ${product.reviewCount} + ')'"> (12)</span>
                            </div>

                            <div class="product-price-box">
                                <span class="effective-price" th:text="'₹' + ${product.effectivePrice}">₹820.00</span>
                                <span th:if="${product.discountPrice != null and product.discountPrice < product.price}" class="original-price" th:text="'₹' + ${product.price}">₹864.00</span>
                                <span class="gst-badge ms-auto" th:text="'GST ' + ${product.gstRate} + '%'">GST 5%</span>
                            </div>

                            <div class="d-flex gap-2 mt-3">
                                <a th:href="@{'/products/' + ${product.id}}"
                                   class="btn btn-krushi btn-sm w-100 d-flex align-items-center justify-content-center gap-1">
                                    <i class="bi bi-eye"></i> <span th:text="#{product.btn.details}">View Details</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pagination -->
            <div class="d-flex justify-content-center mt-4" th:if="${productPage.totalPages > 1}">
                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm">
                        <li class="page-item" th:classappend="${productPage.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/products(page=${productPage.number - 1}, categoryId=${selectedCategory}, company=${selectedCompany}, minPrice=${minPrice}, maxPrice=${maxPrice}, inStockOnly=${inStockOnly}, keyword=${keyword}, sort=${currentSort})}">&laquo;</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, productPage.totalPages - 1)}" th:classappend="${productPage.number == i} ? 'active'">
                            <a class="page-link" th:href="@{/products(page=${i}, categoryId=${selectedCategory}, company=${selectedCompany}, minPrice=${minPrice}, maxPrice=${maxPrice}, inStockOnly=${inStockOnly}, keyword=${keyword}, sort=${currentSort})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${productPage.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/products(page=${productPage.number + 1}, categoryId=${selectedCategory}, company=${selectedCompany}, minPrice=${minPrice}, maxPrice=${maxPrice}, inStockOnly=${inStockOnly}, keyword=${keyword}, sort=${currentSort})}">&raquo;</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
