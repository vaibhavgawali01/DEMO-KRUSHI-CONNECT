<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head('Login | सप्तशृंगी ॲग्रो सर्व्हिसेस')}"></head>
<body class="auth-login-page">
<main class="login-shell">
    <div class="login-topbar">
        <a th:href="@{/}" class="login-back-link">
            <i class="bi bi-arrow-left"></i>
            <span th:text="${#locale.language == 'mr' ? 'दुकानाकडे परत' : 'Back to shop'}">Back to shop</span>
        </a>

        <div class="login-language-switch" role="group" aria-label="Choose language">
            <button type="button" onclick="changeLanguage(event, 'en')"
                    th:classappend="${#locale.language != 'mr'} ? ' active' : ''">EN</button>
            <button type="button" onclick="changeLanguage(event, 'mr')"
                    th:classappend="${#locale.language == 'mr'} ? ' active' : ''">मराठी</button>
        </div>
    </div>

    <section class="login-card" aria-labelledby="loginTitle">
        <div class="login-brand">
            <img th:src="@{/images/saptashrungi_logo_round.jpg}" alt="Krushi Seva Kendra logo">
            <div>
                <div class="login-brand-name">Krushi Seva Kendra</div>
                <div class="login-brand-subtitle">Saptashrungi Agro Services</div>
            </div>
        </div>

        <header class="login-heading">
            <h1 id="loginTitle" th:text="${#locale.language == 'mr' ? 'पुन्हा स्वागत आहे' : 'Welcome back'}">Welcome back</h1>
            <p th:text="${#locale.language == 'mr' ? 'मोबाईल नंबर किंवा ईमेल वापरून लॉगिन करा.' : 'Sign in with your mobile number or email.'}">Sign in with your mobile number or email.</p>
        </header>

        <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
            <span th:text="${#locale.language == 'mr' ? 'मोबाईल नंबर, ईमेल किंवा पासवर्ड चुकीचा आहे. पुन्हा प्रयत्न करा.' : 'Invalid mobile/email or password. Please try again.'}">Invalid login</span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success py-2 small" role="status">
            <span th:text="${successMessage}">Success</span>
        </div>

        <form th:action="@{/login}" method="POST" id="loginForm">
            <div class="login-field">
                <label for="loginUsername" th:text="${#locale.language == 'mr' ? 'मोबाईल नंबर किंवा ईमेल' : 'Mobile number or email'}">Mobile number or email</label>
                <input type="text" name="username" id="loginUsername"
                       th:placeholder="${#locale.language == 'mr' ? 'मोबाईल नंबर किंवा ईमेल' : 'Mobile number or email'}"
                       required autofocus autocomplete="username">
            </div>

            <div class="login-field">
                <label for="loginPassword" th:text="${#locale.language == 'mr' ? 'पासवर्ड' : 'Password'}">Password</label>
                <div class="login-password-wrap">
                    <input type="password" name="password" id="loginPassword"
                           placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="login-password-toggle" onclick="togglePass()"
                            th:attr="aria-label=${#locale.language == 'mr' ? 'पासवर्ड दाखवा किंवा लपवा' : 'Show or hide password'}">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <div class="login-options">
                <label class="login-remember" for="rememberMeCheck">
                    <input type="checkbox" name="remember-me" id="rememberMeCheck">
                    <span th:text="${#locale.language == 'mr' ? 'लक्षात ठेवा' : 'Remember me'}">Remember me</span>
                </label>
                <a th:href="@{/forgot-password}" th:text="${#locale.language == 'mr' ? 'पासवर्ड विसरलात?' : 'Forgot password?'}">Forgot password?</a>
            </div>

            <button type="submit" class="login-submit">
                <span th:text="${#locale.language == 'mr' ? 'लॉगिन करा' : 'Log in'}">Log in</span>
            </button>
        </form>

        <footer class="login-footer">
            <span th:text="${#locale.language == 'mr' ? 'नवीन शेतकरी?' : 'New farmer?'}">New farmer?</span>
            <a th:href="@{/register}" th:text="${#locale.language == 'mr' ? 'नोंदणी करा' : 'Register'}">Register</a>
        </footer>
    </section>
</main>

<script>
function changeLanguage(event, lang) {
    event.preventDefault();
    document.cookie = "krushi_lang=" + encodeURIComponent(lang) + ";path=/;max-age=2592000;SameSite=Lax";
    const url = new URL(window.location.href);
    url.searchParams.set('lang', lang);
    window.location.href = url.toString();
}

function togglePass() {
    const password = document.getElementById('loginPassword');
    const icon = document.getElementById('eyeIcon');
    const isHidden = password.type === 'password';
    password.type = isHidden ? 'text' : 'password';
    icon.className = isHidden ? 'bi bi-eye-slash' : 'bi bi-eye';
}
</script>
</body>
</html>
