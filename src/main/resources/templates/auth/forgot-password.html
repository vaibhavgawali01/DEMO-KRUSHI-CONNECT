<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head('Forgot Password')}"></head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-3">
                <div class="card-body p-4 p-md-5 text-center">
                    <div class="brand-icon-wrapper mx-auto mb-3" style="background: #e8f5e9; color: #1b5e20;">
                        <i class="bi bi-key-fill fs-4"></i>
                    </div>
                    <h4 class="fw-bold mb-2">Password Reset</h4>
                    <p class="text-muted small mb-4">Enter your registered mobile or email to receive password reset assistance.</p>
                    
                    <form onsubmit="event.preventDefault(); document.getElementById('resetFeedback').style.display='block';">
                        <div class="mb-3 text-start">
                            <label class="form-label small fw-bold text-success">Mobile Number / Email</label>
                            <input type="text" class="form-control" placeholder="e.g. 9822012345" required>
                        </div>
                        <button type="submit" class="btn btn-krushi w-100 py-2 fw-bold">Send Reset Link / SMS</button>
                    </form>

                    <div id="resetFeedback" class="alert alert-success mt-3 small" style="display: none;">
                        <i class="bi bi-check-circle-fill me-1"></i> A reset link and OTP has been simulated/sent to your contact details.
                    </div>

                    <div class="mt-4 pt-3 border-top">
                        <a th:href="@{/login}" class="text-success text-decoration-none small">&laquo; Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
