<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-krushi sticky-top">
    <div class="container">
        <!-- Logo & Branding -->
        <a class="navbar-brand-custom" th:href="@{/}">
            <img class="brand-logo" th:src="@{/images/saptashrungi_logo_round.jpg}" alt="Saptashrungi Agro Services Logo">
            <div>
                <span class="brand-text-primary" th:text="#{app.name}">Saptashrungi Agro Services</span>
                <span class="brand-text-secondary d-none d-sm-block" th:text="#{app.tagline}">आपल्या शेतीसाठी योग्य मार्गदर्शन</span>
            </div>
        </a>

        <!-- Mobile Toggle -->
        <button class="navbar-toggler border-0 ms-auto me-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Content -->
        <div class="collapse navbar-collapse" id="navbarMain">
            <!-- Nav Links -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                <li class="nav-item">
                    <a class="nav-link nav-link-custom" th:href="@{/}" th:text="#{nav.home}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-link-custom" th:href="@{/products}" th:text="#{nav.products}">Products</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-link-custom" th:href="@{/offers}" th:text="#{nav.offers}">Offers</a>
                </li>

                <!-- Farming Advisory Dropdown -->
                <li class="nav-item dropdown">
                    <a class="nav-link nav-link-custom dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-cloud-sun text-success me-1"></i><span th:text="#{nav.farming_tips}">Farming Advisory</span>
                    </a>
                    <ul class="dropdown-menu shadow border-0 rounded-3 mt-1 p-1">
                        <li><a class="dropdown-item rounded-2 py-2" th:href="@{/weather}"><i class="bi bi-cloud-rain me-2 text-primary"></i><span th:text="#{nav.weather}">Weather Forecast</span></a></li>
                        <li><a class="dropdown-item rounded-2 py-2" th:href="@{/farming-tips}"><i class="bi bi-journal-text me-2 text-warning"></i><span>Crop Care &amp; Pest Advice</span></a></li>
                    </ul>
                </li>

                <li class="nav-item">
                    <a class="nav-link nav-link-custom" th:href="@{/about}" th:text="#{nav.about}">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-link-custom" th:href="@{/contact}" th:text="#{nav.contact}">Contact</a>
                </li>
            </ul>

            <!-- Live Search Bar -->
            <div class="navbar-search-wrap me-lg-3 my-2 my-lg-0">
                <form th:action="@{/products}" method="GET" class="d-flex">
                    <div class="position-relative">
                        <i class="bi bi-search navbar-search-icon"></i>
                        <input type="text" id="globalSearchInput" name="keyword" class="form-control form-control-sm navbar-search-input"
                               th:placeholder="#{product.search_placeholder}" autocomplete="off">
                    </div>
                </form>
                <div id="searchDropdownResults" class="position-absolute w-100 bg-white border rounded-3 shadow mt-1" style="z-index:1050; max-height:320px; overflow-y:auto; display:none;"></div>
            </div>

            <!-- Right Controls -->
            <div class="d-flex align-items-center gap-2">
                <!-- Language Switcher -->
                <div class="dropdown">
                    <button class="btn btn-sm btn-light border rounded-pill d-flex align-items-center gap-1 px-2" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-translate text-success"></i>
                        <span class="d-none d-sm-inline" th:text="${#locale.language == 'mr' ? 'मराठी' : 'EN'}" style="font-size:0.8rem;">EN</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-3 p-1 mt-1">
                        <li><a class="dropdown-item rounded-2 py-2" th:href="@{/(lang='mr')}">🌾 मराठी (Marathi)</a></li>
                        <li><a class="dropdown-item rounded-2 py-2" th:href="@{/(lang='en')}">🌍 English</a></li>
                    </ul>
                </div>

                <!-- Dark Mode Toggle -->
                <button id="themeToggleBtn" class="nav-icon-btn" title="Toggle Dark Mode" type="button">
                    <i class="bi bi-moon-stars-fill" style="font-size:0.9rem;"></i>
                </button>

                <!-- Notification Bell (admin only) -->
                <div sec:authorize="hasAuthority('ROLE_ADMIN')" class="nav-icon-btn" style="cursor:pointer;" data-bs-toggle="tooltip" title="Alerts">
                    <i class="bi bi-bell" style="font-size:0.9rem;"></i>
                    <span class="notif-dot"></span>
                </div>




                <!-- User Auth Area -->
                <div sec:authorize="isAuthenticated()" class="dropdown">
                    <button class="btn btn-sm d-flex align-items-center gap-2 rounded-pill px-3 py-1 border"
                            style="background:var(--light-green); border-color:rgba(27,94,32,0.15)!important;"
                            type="button" data-bs-toggle="dropdown">
                        <span class="user-avatar-btn" sec:authentication="name" style="width:26px;height:26px;font-size:0.7rem;">A</span>
                        <span sec:authentication="name" class="d-none d-md-inline text-truncate fw-semibold" style="max-width:80px;font-size:0.82rem;color:var(--primary-green);">Admin</span>
                        <i class="bi bi-chevron-down text-muted" style="font-size:0.65rem;"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-3 p-1 mt-1" style="min-width:200px;">
                        <li sec:authorize="hasAuthority('ROLE_ADMIN')">
                            <a class="dropdown-item rounded-2 py-2 text-success fw-bold" th:href="@{/admin/dashboard}">
                                <i class="bi bi-speedometer2 me-2"></i><span th:text="#{nav.admin_panel}">Admin Panel</span>
                            </a>
                        </li>
                        <li sec:authorize="hasAuthority('ROLE_ADMIN')"><hr class="dropdown-divider my-1"></li>
                        <li><a class="dropdown-item rounded-2 py-2" th:href="@{/customer/udhari}"><i class="bi bi-credit-card me-2 text-warning"></i><span th:text="#{nav.my_udhari}">My Udhari</span></a></li>
                        <li><a class="dropdown-item rounded-2 py-2" th:href="@{/customer/profile}"><i class="bi bi-person me-2"></i><span th:text="#{nav.profile}">Profile</span></a></li>
                        <li><hr class="dropdown-divider my-1"></li>
                        <li>
                            <form th:action="@{/logout}" method="POST" class="m-0 p-0">
                                <button type="submit" class="dropdown-item rounded-2 py-2 text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i><span th:text="#{nav.logout}">Logout</span>
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>

                <!-- Login/Register (unauthenticated) -->
                <div sec:authorize="!isAuthenticated()" class="d-flex align-items-center gap-2">
                    <a th:href="@{/login}" class="btn-nav-login">
                        <i class="bi bi-person"></i>
                        <span th:text="#{nav.login}">Login</span>
                    </a>
                    <a th:href="@{/register}" class="btn-nav-register d-none d-sm-inline-flex">
                        <span>Join Us</span>
                        <i class="bi bi-arrow-up-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
