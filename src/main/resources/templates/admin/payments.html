<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head('Payment Records')}"></head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container-fluid px-lg-5 my-4">
    <div class="row g-4">
        <div class="col-lg-2">
            <div th:replace="~{layout/sidebar-admin :: admin-sidebar('payments')}"></div>
        </div>

        <div class="col-lg-10">
            <!-- Header & Search Toolbar -->
            <div class="card border-0 shadow-sm rounded-3 mb-4">
                <div class="card-body p-3 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                    <div>
                        <h4 class="fw-bold text-success mb-0"><i class="bi bi-cash-stack me-2"></i>Payment Transactions & Receipts</h4>
                        <small class="text-muted">Total: <span th:text="${paymentPage.totalElements}">3</span> payment transactions</small>
                    </div>

                    <form th:action="@{/admin/payments}" method="GET" class="d-flex">
                        <div class="input-group input-group-sm">
                            <input type="text" name="query" class="form-control" placeholder="Search customer, mobile, txn id..." th:value="${query}">
                            <button type="submit" class="btn btn-krushi"><i class="bi bi-search"></i></button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Payments Table -->
            <div class="card border-0 shadow-sm rounded-3 overflow-hidden mb-4">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-krushi mb-0">
                            <thead>
                                <tr>
                                    <th>Receipt #</th>
                                    <th>Date</th>
                                    <th>Farmer Name</th>
                                    <th>Amount (₹)</th>
                                    <th>Payment Method</th>
                                    <th>Transaction ID</th>
                                    <th>Linked Reference</th>
                                    <th>Remarks</th>
                                    <th class="text-end">Receipt</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${paymentPage.empty}">
                                    <td colspan="9" class="text-center py-5 text-muted">No payments found.</td>
                                </tr>
                                <tr th:each="p : ${paymentPage.content}">
                                    <td><strong class="text-dark" th:text="'REC-' + ${p.id}">REC-1</strong></td>
                                    <td class="small" th:text="${#temporals.format(p.paymentDate, 'dd MMM yyyy, hh:mm a')}">Date</td>
                                    <td>
                                        <strong class="text-dark d-block small" th:text="${p.user.name}">Ramesh Patil</strong>
                                        <small class="text-muted" th:text="${p.user.mobile}">9822012345</small>
                                    </td>
                                    <td><strong class="text-success" th:text="'₹' + ${p.amount}">₹2,500.00</strong></td>
                                    <td><span class="badge bg-light text-dark border" th:text="${p.paymentMethod.displayNameEn}">UPI</span></td>
                                    <td><code class="small text-muted" th:text="${p.transactionId}">UPI-TXN-123</code></td>
                                    <td class="small">
                                        <span th:if="${p.order != null}" th:text="'Order #' + ${p.order.orderNumber}">Order</span>
                                        <span th:if="${p.udhari != null}" th:text="'Udhari #' + ${p.udhari.id}">Udhari</span>
                                    </td>
                                    <td class="small text-muted" th:text="${p.remarks}">Remarks</td>
                                    <td class="text-end">
                                        <a th:href="@{'/customer/payments/' + ${p.id} + '/receipt'}" target="_blank" class="btn btn-sm btn-outline-success py-1 px-2">
                                            <i class="bi bi-printer"></i> View
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Pagination -->
            <div class="d-flex justify-content-center" th:if="${paymentPage.totalPages > 1}">
                <nav aria-label="Payments pagination">
                    <ul class="pagination pagination-sm">
                        <li class="page-item" th:classappend="${paymentPage.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/payments(page=${paymentPage.number - 1}, query=${query})}">&laquo;</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, paymentPage.totalPages - 1)}" th:classappend="${paymentPage.number == i} ? 'active'">
                            <a class="page-link" th:href="@{/admin/payments(page=${i}, query=${query})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${paymentPage.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/payments(page=${paymentPage.number + 1}, query=${query})}">&raquo;</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
