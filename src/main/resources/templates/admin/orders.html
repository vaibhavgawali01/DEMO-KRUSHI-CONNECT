<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head('Orders Management')}"></head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container-fluid px-lg-5 my-4">
    <div class="row g-4">
        <div class="col-lg-2">
            <div th:replace="~{layout/sidebar-admin :: admin-sidebar('orders')}"></div>
        </div>

        <div class="col-lg-10">
            <!-- Header & Search Toolbar -->
            <div class="card border-0 shadow-sm rounded-3 mb-4">
                <div class="card-body p-3 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                    <div>
                        <h4 class="fw-bold text-success mb-0"><i class="bi bi-cart-check me-2"></i><span th:text="${#locale.language == 'mr' ? 'ऑर्डर्स व बिलिंग व्यवस्थापन' : 'Orders & Billing Manager'}">Orders & Billing Manager</span></h4>
                        <small class="text-muted"><span th:text="${#locale.language == 'mr' ? 'एकूण ऑर्डर्स: ' : 'Total orders: '}">Total: </span><span th:text="${orderPage.totalElements}">3</span></small>
                    </div>

                    <form th:action="@{/admin/orders}" method="GET" class="d-flex">
                        <div class="input-group input-group-sm">
                            <input type="text" name="query" class="form-control" 
                                   th:placeholder="${#locale.language == 'mr' ? 'ऑर्डर क्र., नाव किंवा मोबाईल शोधा...' : 'Search order #, customer, mobile...'}" th:value="${query}">
                            <button type="submit" class="btn btn-krushi"><i class="bi bi-search"></i></button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Orders Table -->
            <div class="card border-0 shadow-sm rounded-3 overflow-hidden mb-4">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-krushi mb-0">
                            <thead>
                                <tr>
                                    <th th:text="${#locale.language == 'mr' ? 'ऑर्डर क्रमांक' : 'Order #'}">Order #</th>
                                    <th th:text="${#locale.language == 'mr' ? 'तारीख' : 'Date'}">Date</th>
                                    <th th:text="${#locale.language == 'mr' ? 'शेतकरी ग्राहक' : 'Customer'}">Customer</th>
                                    <th th:text="${#locale.language == 'mr' ? 'रक्कम' : 'Subtotal'}">Subtotal</th>
                                    <th>GST</th>
                                    <th th:text="${#locale.language == 'mr' ? 'एकूण रक्कम' : 'Total Amount'}">Total Amount</th>
                                    <th th:text="${#locale.language == 'mr' ? 'पेमेंट पद्धत' : 'Payment Method'}">Payment Method</th>
                                    <th th:text="${#locale.language == 'mr' ? 'पेमेंट स्थिती' : 'Payment Status'}">Payment Status</th>
                                    <th th:text="${#locale.language == 'mr' ? 'ऑर्डर स्थिती' : 'Order Status'}">Order Status</th>
                                    <th class="text-end" th:text="${#locale.language == 'mr' ? 'कृती' : 'Actions'}">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${orderPage.empty}">
                                    <td colspan="10" class="text-center py-5 text-muted" th:text="${#locale.language == 'mr' ? 'कोणत्याही ऑर्डर्स सापडल्या नाहीत.' : 'No orders found.'}">No orders found.</td>
                                </tr>
                                <tr th:each="o : ${orderPage.content}">
                                    <td><strong class="text-dark" th:text="${o.orderNumber}">KSK-2026-00001</strong></td>
                                    <td class="small" th:text="${#temporals.format(o.createdAt, 'dd MMM yyyy')}">01 Aug 2026</td>
                                    <td>
                                        <strong class="text-dark d-block small" th:text="${o.user.name}">Ramesh Patil</strong>
                                        <small class="text-muted" th:text="${o.user.mobile}">9822012345</small>
                                    </td>
                                    <td class="small" th:text="'₹' + ${o.subtotal}">₹4,380.00</td>
                                    <td class="small text-muted" th:text="'₹' + ${o.gst}">₹219.00</td>
                                    <td><strong class="text-success" th:text="'₹' + ${o.total}">₹4,499.00</strong></td>
                                    <td><span class="badge bg-light text-dark border" th:text="${o.paymentMethod.displayNameEn}">UDHARI</span></td>
                                    <td>
                                        <span class="badge" 
                                              th:classappend="${o.paymentStatus.name() == 'PAID'} ? 'bg-success' : (${o.paymentStatus.name() == 'PENDING'} ? 'bg-warning text-dark' : 'bg-danger')"
                                              th:text="${o.paymentStatus.displayNameEn}">Pending</span>
                                    </td>
                                    <td>
                                        <span class="badge" 
                                              th:classappend="${o.orderStatus.name() == 'DELIVERED'} ? 'bg-success' : (${o.orderStatus.name() == 'PENDING'} ? 'bg-warning text-dark' : 'bg-info')"
                                              th:text="${o.orderStatus.displayNameEn}">Delivered</span>
                                    </td>
                                    <td class="text-end">
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{'/admin/orders/' + ${o.id}}" class="btn btn-outline-primary py-1 px-2" title="Manage Order">
                                                <i class="bi bi-gear"></i> Manage
                                            </a>
                                            <a th:href="@{'/customer/orders/' + ${o.id} + '/invoice'}" target="_blank" class="btn btn-outline-success py-1 px-2" title="Print Invoice">
                                                <i class="bi bi-printer"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Pagination -->
            <div class="d-flex justify-content-center" th:if="${orderPage.totalPages > 1}">
                <nav aria-label="Orders pagination">
                    <ul class="pagination pagination-sm">
                        <li class="page-item" th:classappend="${orderPage.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/orders(page=${orderPage.number - 1}, query=${query})}">&laquo;</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, orderPage.totalPages - 1)}" th:classappend="${orderPage.number == i} ? 'active'">
                            <a class="page-link" th:href="@{/admin/orders(page=${i}, query=${query})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${orderPage.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/orders(page=${orderPage.number + 1}, query=${query})}">&raquo;</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
