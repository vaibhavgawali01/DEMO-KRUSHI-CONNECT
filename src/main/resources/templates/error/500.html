<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head('Server Error')}"></head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container my-5 py-5 text-center">
    <div class="brand-icon-wrapper mx-auto mb-3" style="width: 80px; height: 80px; background: #ffebee; color: #c62828; font-size: 2.5rem;">
        <i class="bi bi-bug"></i>
    </div>
    <h1 class="display-4 fw-bold text-dark">500</h1>
    <h4 class="fw-bold mb-3">Internal Server Error / सर्व्हर त्रुटी</h4>
    <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'An unexpected server error occurred while processing your request.'}">Server error</p>
    <a th:href="@{/}" class="btn btn-krushi px-4 py-2">&laquo; Return to Store Home</a>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
