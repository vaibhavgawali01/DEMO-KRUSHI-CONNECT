<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head('Page Not Found')}"></head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container my-5 py-5 text-center">
    <div class="brand-icon-wrapper mx-auto mb-3" style="width: 80px; height: 80px; background: #ffebee; color: #c62828; font-size: 2.5rem;">
        <i class="bi bi-exclamation-triangle"></i>
    </div>
    <h1 class="display-4 fw-bold text-dark">404</h1>
    <h4 class="fw-bold mb-3">Page Not Found / पृष्ठ सापडले नाही</h4>
    <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'The page you are looking for might have been removed or is temporarily unavailable.'}">Error description</p>
    <a th:href="@{/}" class="btn btn-krushi px-4 py-2">&laquo; Return to Home / मुख्यपृष्ठावर जा</a>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
